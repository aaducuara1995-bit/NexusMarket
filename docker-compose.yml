# NexusMarket with its two databases, following the reference project.
# Everything:        docker compose up -d --build      (from the NexusMarket folder)
# Only databases:    docker compose up -d mysql-db mongo-db   (then run .\mvnw spring-boot:run)
# Stop:              docker compose down               (the data stays in the volumes)
# Host ports 3307 and 27018 avoid clashing with a MySQL or MongoDB installed on Windows.
services:
  mysql-db:
    image: mysql:8.0
    container_name: nexusmarket-mysql
    restart: always
    environment:
      MYSQL_DATABASE: nexusmarket_db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-nexus_root_password}
      MYSQL_USER: nexus_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nexus_app_password}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-db:
    image: mongo:6.0
    container_name: nexusmarket-mongo
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  nexusmarket-app:
    build:
      context: ./nexusmarket
      dockerfile: Dockerfile
    container_name: nexusmarket-app
    working_dir: /workspace
    volumes:
      - ./nexusmarket:/workspace
      - maven_cache:/root/.m2
    ports:
      - "${HOST_SERVER_PORT:-8080}:8080"
    environment:
      DB_URL: "${DB_URL:-jdbc:mysql://mysql-db:3306/nexusmarket_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
      DB_USERNAME: ${DB_USERNAME:-nexus_app}
      DB_PASSWORD: ${DB_PASSWORD:-${MYSQL_PASSWORD:-nexus_app_password}}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo-db:27017/nexusmarket_audit}
      JWT_SECRET: ${JWT_SECRET:-TDEATDEATDEATDEATDEATDEATDEATDEA}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      SERVER_PORT: 8080
    depends_on:
      mysql-db:
        condition: service_healthy
      mongo-db:
        condition: service_healthy
    command: ["mvn", "-B", "spring-boot:run"]

volumes:
  mysql_data:
  mongo_data:
  maven_cache: