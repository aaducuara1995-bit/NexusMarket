spring.application.name=nexus

# MySQL: business data (Spring Data JPA)
# By default it points to the MySQL container of docker-compose.yml (host port 3307,
# so it does not collide with a MySQL installed on Windows). Override with DB_URL,
# DB_USERNAME and DB_PASSWORD to use another server.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/nexusmarket_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:nexus_app}
spring.datasource.password=${DB_PASSWORD:nexus_app_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate creates and updates the tables from the JPA entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# MongoDB: audit log (Spring Data MongoDB)
# Spring Boot 4 uses the spring.mongodb prefix. Container host port 27018.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27018/nexusmarket_audit}

# First administrator, created only if no admin exists
nexusmarket.bootstrap-admin.email=${ADMIN_EMAIL:admin@nexusmarket.com}
nexusmarket.bootstrap-admin.document=${ADMIN_DOCUMENT:1000000000}